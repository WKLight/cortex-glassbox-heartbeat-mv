<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORTEX // 硝子箱の心拍証明 — 4K60 Strict Duotone MV (Version B · 32 Plates · 43 Cuts)</title>
  <style>
    :root {
      --bg: #07080a;
      --panel: rgba(13, 16, 22, 0.92);
      --border: rgba(234, 236, 242, 0.16);
      --fg: #eaecf2;
      --muted: #929bae;
      --cyan: #38bdf8;
      --signal: #ff385c;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 14px 18px;
      user-select: none;
    }
    body.pure-stage {
      padding: 0;
      overflow: hidden;
      background: #07080a;
    }
    body.pure-stage .topbar,
    body.pure-stage .ctrlbar {
      display: none !important;
    }
    body.pure-stage .shell {
      max-width: none;
      width: 100vw;
      height: 100vh;
    }
    body.pure-stage .stage-wrap {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    .shell {
      width: 100%;
      max-width: 1480px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .topbar, .ctrlbar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 13px;
      backdrop-filter: blur(10px);
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot-live {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 10px var(--signal);
    }
    .brand-title {
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: 0.03em;
    }
    .brand-sub {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--cyan);
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    button, .file-lbl {
      background: rgba(18, 21, 28, 0.92);
      color: var(--fg);
      border: 1px solid rgba(234, 236, 242, 0.20);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    button:hover, .file-lbl:hover {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.14);
    }
    button.primary {
      background: rgba(255, 56, 92, 0.20);
      border-color: var(--signal);
      color: #ffe4e8;
    }
    button.primary:hover {
      background: rgba(255, 56, 92, 0.34);
    }
    button.active {
      background: var(--fg);
      border-color: var(--fg);
      color: #07080a;
    }
    .stage-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #07080a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(234, 236, 242, 0.22);
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.75);
    }
    #gl-canvas, #fallback-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    #fallback-canvas { display: none; }
    .drop-hint {
      position: absolute;
      inset: 0;
      background: rgba(7, 8, 10, 0.88);
      border: 2px dashed var(--signal);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 800;
      color: var(--fg);
      pointer-events: none;
      z-index: 20;
    }
    .stage-wrap.dragover .drop-hint { display: flex; }
    .scrub-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #scrubber {
      flex: 1;
      accent-color: var(--signal);
      height: 5px;
      cursor: pointer;
    }
    .mono-stat {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
    }
    .sec-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid rgba(234, 236, 242, 0.10);
    }
    .sec-pill {
      font-family: "JetBrains Mono", "PingFang SC", "Microsoft YaHei UI", monospace;
      font-size: 10.5px;
      padding: 3px 7px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid rgba(234, 236, 242, 0.10);
      font-size: 11px;
    }
    .badge {
      font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(234, 236, 242, 0.06);
      border: 1px solid rgba(234, 236, 242, 0.18);
      color: var(--fg);
    }
    .badge.hot {
      background: rgba(255, 56, 92, 0.14);
      border-color: rgba(255, 56, 92, 0.42);
      color: #ffb3c1;
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const urlTime = params.has('t') ? Number(params.get('t')) : null;
      const urlScale = params.has('scale') ? clampNum(Number(params.get('scale')), 1, 2) : 1;
      const urlHideUI = params.get('ui') === '0';

      if (urlHideUI) document.body.classList.add('pure-stage');

      function clampNum(v, a, b) { return v < a ? a : v > b ? b : v; }

      const glCanvas = document.getElementById('gl-canvas');
      const fbCanvas = document.getElementById('fallback-canvas');
      const stageWrap = document.getElementById('stage-wrap');

      const stageCanvas = document.createElement('canvas');
      let renderW = Math.round(1920 * urlScale);
      let renderH = Math.round(1080 * urlScale);
      stageCanvas.width = renderW;
      stageCanvas.height = renderH;
      const sCtx = stageCanvas.getContext('2d', { alpha: true });

      const sync = new window.CortexAudioSyncEngine();
      const timeline = new window.CortexPlateTimeline();
      const postFX = new window.CortexWebGLPostFX(glCanvas);
      if (!postFX.ok) {
        glCanvas.style.display = 'none';
        fbCanvas.style.display = 'block';
      }
      const fbCtx = fbCanvas.getContext('2d', { alpha: true });

      const btnPlay = document.getElementById('btn-play');
      const btnSynth = document.getElementById('btn-synth');
      const btnRes = document.getElementById('btn-res');
      const btnRecord = document.getElementById('btn-record');
      const btnFs = document.getElementById('btn-fs');
      const fileAudio = document.getElementById('file-audio');
      const scrubber = document.getElementById('scrubber');
      const timeCur = document.getElementById('time-cur');
      const timeDur = document.getElementById('time-dur');
      const syncStatus = document.getElementById('sync-status');
      const badgePlate = document.getElementById('badge-plate');
      const badgeCue = document.getElementById('badge-cue');
      const badgeBeat = document.getElementById('badge-beat');
      const lblOffset = document.getElementById('lbl-offset');
      const pills = Array.from(document.querySelectorAll('#plate-strip .sec-pill'));

      if (renderW === 3840) {
        btnRes.textContent = '🖥 精度: 4K UHD (3840×2160)';
        btnRes.classList.add('active');
      }

      let isScrubbing = false;
      let frozenTime = (urlTime !== null && !Number.isNaN(urlTime)) ? urlTime : null;
      if (frozenTime !== null) sync.seek(frozenTime);

      function fmtTime(sec) {
        const m = Math.floor(sec / 60);
        const s = (sec % 60).toFixed(2).padStart(5, '0');
        return `${String(m).padStart(2, '0')}:${s}`;
      }

      function updateOffsetLabel() {
        const ms = Math.round(sync.syncOffsetSec * 1000);
        lblOffset.textContent = `${ms >= 0 ? '+' : ''}${ms}ms`;
      }
      updateOffsetLabel();

      sync.onStatusChange = (msg) => {
        syncStatus.textContent = msg;
        timeDur.textContent = fmtTime(sync.duration);
        scrubber.max = String(sync.duration);
      };
      syncStatus.textContent = sync.statusText;

      function renderFrame(explicitTime = null) {
        const tUse = explicitTime !== null ? explicitTime : frozenTime;
        const state = sync.getFrameState(tUse);
        const postOpts = timeline.render(sCtx, state, renderW, renderH);

        if (!postFX.present(stageCanvas, state, postOpts)) {
          if (fbCanvas.width !== renderW) { fbCanvas.width = renderW; fbCanvas.height = renderH; }
          fbCtx.drawImage(stageCanvas, 0, 0);
        }

        if (explicitTime === null && !urlHideUI) {
          if (!isScrubbing) scrubber.value = String(state.rawTime);
          timeCur.textContent = fmtTime(state.rawTime);
          const activePl = timeline.findPlate(state.t);
          badgePlate.textContent = `PLATE: P${activePl.num} · ${activePl.title} (${activePl.temp})`;
          badgeCue.textContent = `CUE: ${state.cue.id}`;
          badgeBeat.textContent = `BEAT: ${state.cumBeat.toFixed(1)} · ${state.localBpm.toFixed(1)} BPM`;

          for (let i = 0; i < pills.length; i++) {
            const j0 = Number(pills[i].dataset.jump);
            const j1 = i + 1 < pills.length ? Number(pills[i + 1].dataset.jump) : 281.61;
            const active = state.t >= j0 && state.t < j1;
            pills[i].classList.toggle('active', !!active);
          }
        }
        return state;
      }

      // Deterministic 4K60 / 1080p60 render hook for `render/export_4k60_mv.py` & headless verification!
      window.renderMVFrameAt = function (timeSec, width = 3840, height = 2160) {
        if (renderW !== width || renderH !== height) {
          renderW = width; renderH = height;
          stageCanvas.width = width; stageCanvas.height = height;
        }
        sync.pause();
        frozenTime = timeSec;
        renderFrame(timeSec);
        return postFX.ok ? glCanvas : fbCanvas;
      };

      function tick() {
        renderFrame(null);
        requestAnimationFrame(tick);
      }
      renderFrame(null);
      if (window.CortexPDoomCore && window.CortexPDoomCore.preloadAssets) {
        window.CortexPDoomCore.preloadAssets().then(() => {
          if (!sync.playing) renderFrame(frozenTime);
        });
      }
      requestAnimationFrame(tick);

      function togglePlay() {
        frozenTime = null;
        const on = sync.toggle();
        btnPlay.textContent = on ? '⏸ 暂停 MV' : '▶ 继续播放';
      }
      btnPlay.addEventListener('click', togglePlay);
      glCanvas.addEventListener('click', togglePlay);
      fbCanvas.addEventListener('click', togglePlay);

      btnSynth.addEventListener('click', () => {
        frozenTime = null;
        sync.enableSynthFallback();
        btnPlay.textContent = '⏸ 暂停 MV';
        sync.play();
      });

      btnRes.addEventListener('click', () => {
        if (renderW === 1920) {
          renderW = 3840; renderH = 2160;
          btnRes.textContent = '🖥 精度: 4K UHD (3840×2160)';
          btnRes.classList.add('active');
        } else {
          renderW = 1920; renderH = 1080;
          btnRes.textContent = '🖥 精度: 1080p (可切4K UHD)';
          btnRes.classList.remove('active');
        }
        stageCanvas.width = renderW;
        stageCanvas.height = renderH;
      });

      btnFs.addEventListener('click', () => {
        if (!document.fullscreenElement) stageWrap.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      });

      scrubber.addEventListener('pointerdown', () => { isScrubbing = true; });
      scrubber.addEventListener('input', () => {
        frozenTime = null;
        sync.seek(Number(scrubber.value));
      });
      window.addEventListener('pointerup', () => { isScrubbing = false; });

      pills.forEach((btn) => {
        btn.addEventListener('click', () => {
          frozenTime = null;
          sync.seek(Number(btn.dataset.jump));
          if (!sync.playing) togglePlay();
        });
      });

      document.getElementById('btn-off-dec').addEventListener('click', () => {
        sync.setSyncOffsetMs(Math.round(sync.syncOffsetSec * 1000) - 15);
        updateOffsetLabel();
      });
      document.getElementById('btn-off-inc').addEventListener('click', () => {
        sync.setSyncOffsetMs(Math.round(sync.syncOffsetSec * 1000) + 15);
        updateOffsetLabel();
      });

      // `pdoom-video` Precision Keyboard Transport Controls!
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
        const cur = frozenTime !== null ? frozenTime : sync.getCurrentTime();
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          frozenTime = null;
          sync.seek(cur - (e.shiftKey ? 5 : 1));
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          frozenTime = null;
          sync.seek(cur + (e.shiftKey ? 5 : 1));
        } else if (e.key === ',' || e.key === '.') {
          e.preventDefault();
          sync.pause();
          btnPlay.textContent = '▶ 继续播放';
          const step = e.key === '.' ? (1 / 60) : -(1 / 60);
          frozenTime = clampNum(cur + step, 0, sync.duration);
          sync.seek(frozenTime);
        } else if (e.key === '[' || e.key === ']') {
          e.preventDefault();
          const pls = timeline.plates;
          let idx = pls.findIndex((p) => cur >= p.t0 && cur < p.t1);
          if (idx < 0) idx = 0;
          idx = clampNum(idx + (e.key === ']' ? 1 : -1), 0, pls.length - 1);
          frozenTime = null;
          sync.seek(pls[idx].t0 + 0.02);
        } else if (e.key === 'h' || e.key === 'H') {
          document.body.classList.toggle('pure-stage');
        } else if (e.key === 'f' || e.key === 'F') {
          if (!document.fullscreenElement) stageWrap.requestFullscreen().catch(() => {});
          else document.exitFullscreen();
        }
      });

      fileAudio.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          frozenTime = null;
          sync.loadLocalFile(e.target.files[0]);
        }
      });
      stageWrap.addEventListener('dragover', (e) => {
        e.preventDefault();
        stageWrap.classList.add('dragover');
      });
      stageWrap.addEventListener('dragleave', () => stageWrap.classList.remove('dragover'));
      stageWrap.addEventListener('drop', (e) => {
        e.preventDefault();
        stageWrap.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          frozenTime = null;
          sync.loadLocalFile(e.dataTransfer.files[0]);
        }
      });

      // Built-in High-Bitrate 60fps Video Recorder
      let mediaRec = null;
      let recChunks = [];
      btnRecord.addEventListener('click', () => {
        if (mediaRec && mediaRec.state === 'recording') {
          mediaRec.stop();
          return;
        }
        const targetCanvas = postFX.ok ? glCanvas : fbCanvas;
        const stream = targetCanvas.captureStream(60);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
          ? 'video/webm;codecs=vp9'
          : 'video/webm';
        recChunks = [];
        mediaRec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 45_000_000 });
        mediaRec.ondataavailable = (ev) => { if (ev.data.size > 0) recChunks.push(ev.data); };
        mediaRec.onstop = () => {
          const blob = new Blob(recChunks, { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `CORTEX_硝子箱の心拍証明_VersionB_Treatise_${renderW}x${renderH}_60fps.webm`;
          a.click();
          btnRecord.textContent = '⏺ 录制导出视频';
          btnRecord.classList.remove('primary');
        };
        mediaRec.start(1000);
        if (!sync.playing) togglePlay();
        btnRecord.textContent = '⏹ 停止并下载高清视频';
        btnRecord.classList.add('primary');
      });
    })();
  </script>
</body>
</html>
